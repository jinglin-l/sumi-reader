<!doctype html>
<!-- Test harness: the real reader.html markup, plus a fake `browser.storage.session` that reads
     the article test/run puts in localStorage, so reader.js can run in a normal tab. -->
<html lang="en"><head><meta charset="utf-8"><title>Sumi Reader</title>
<link rel="stylesheet" href="../reader.css"></head><body>

  <div id="sr-root">
    <!-- Empty on purpose: it exists so the article sits centred between two margins like the
         explainer shell, and doodles.js fills it with doodles. -->
    <aside id="sr-left"></aside>
    <main id="sr-center">
      <nav class="sr-crumbs">
        <a id="sr-back" href="#">← back to page</a>
        <span class="sr-sep">/</span>
        <a id="sr-site" href="#"></a>
      </nav>
      <article id="sr-article">
        <header>
          <h1 id="sr-title"></h1>
          <p class="sr-meta" id="sr-meta"></p>
        </header>
        <div id="sr-content"></div>
      </article>
    </main>
    <aside id="sr-right">
      <div class="sr-toc-box">
        <h3>Table of Contents</h3>
        <ol id="sr-toc"></ol>
      </div>
    </aside>
  </div>
<script>
window.SENT = [];
window.browser = {
  storage: { session: { get: async (k) => ({ [k]: JSON.parse(localStorage.getItem("article")) }) } },
  // Records what reader.js sends; toggleSite answers "now off", like background.js would
  // for a site that was on.
  runtime: { sendMessage: async (m) => { SENT.push(m.type); return m.type === "toggleSite" ? false : true; }, onMessage: { addListener: () => {} } },
};
</script>
<script src="../reader.js"></script>
<script src="../doodles.js"></script>
</body></html>
